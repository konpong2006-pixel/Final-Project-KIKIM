plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.smartlifelinelistener'
version = '0.1.0'

android {
  namespace "expo.modules.smartlifelinelistener"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // expo-modules-core depends on this via `implementation`, not `api`, so it
  // is not visible transitively -- needed here directly for the sleep
  // widget's Headless JS task service (com.facebook.react.HeadlessJsTaskService).
  implementation 'com.facebook.react:react-android'
}
